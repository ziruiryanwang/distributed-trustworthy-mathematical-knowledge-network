[package]
name = "nanoda_lib"
version = "0.4.19"
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false

[lib]
path = "../../modules/native/proof_validation/lib.rs"

[dependencies]
indexmap = "2.13.0"
rustc-hash = "1.1.0"
num-bigint = { version = "0.5.1", features = ["serde"] }
