[package]
name = "dmkn-aggregate-relation"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[lib]
name = "dmkn_aggregate_relation"
path = "lib.rs"

[[bin]]
name = "dmkn-aggregate-guest"
path = "main.rs"
required-features = ["guest"]

[workspace]

[features]
default = []
guest = ["dep:risc0-zkvm"]

[dependencies]
dmkn-module-relation = { path = "../modules/receipt" }
serde_json = "1.0.111"
risc0-zkvm = { path = "E:/Distributed Trustworthy Mathematical Knowledge Network/experiments/general-checker-guest-01/host-prepare-01/candidate/risc0-3bbcd44d6459b9ef6ac0df3846dc9215514934e8/risc0/zkvm", default-features = false, features = ["std"], optional = true }

[profile.release]
opt-level = 3
overflow-checks = true
lto = true
panic = "abort"
